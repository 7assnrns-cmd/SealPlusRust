name: Build Android APK and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Rust target for Android
      run: |
        rustup target add aarch64-linux-android

    - name: Install Tauri CLI & Dependencies
      run: npm install

    - name: Initialize Tauri Android Project
      run: |
        echo "y" | npx tauri android init || true

    - name: Build Android App (Tauri)
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        if [ -f "src-tauri/gen/android/gradlew" ]; then
          chmod +x src-tauri/gen/android/gradlew
        fi
        npx tauri android build --target aarch64

    - name: Create Release Draft & Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v0.1.0
        name: "Seal Plus Rust v0.1.0 🚀"
        draft: true
        prerelease: false
        files: |
          src-tauri/gen/android/app/build/outputs/apk/release/app-release-unsigned.apk
          src-tauri/gen/android/app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
