name: Build Android APK and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Rust targets for Android
      run: |
        rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

    - name: Install Tauri CLI & Dependencies
      run: npm install

    - name: Generate Valid RGBA Icons Automatically
      run: |
        cat << 'GENEOF' > generate_icons.py
        import zlib, struct, os
        os.makedirs('src-tauri/icons', exist_ok=True)
        def make_png(w, h, c):
            def chunk(tag, data):
                return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xFFFFFFFF)
            ihdr = struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)
            raw = b"".join(b'\x00' + bytes(c) * w for _ in range(h))
            idat = zlib.compress(raw)
            return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', idat) + chunk(b'IEND', b'')
        
        png_data = make_png(32, 32, (33, 150, 243, 255))
        for name in ['icon.png', '32x32.png', '128x128.png', 'icon.ico', 'icon.icns']:
            with open(os.path.join('src-tauri/icons', name), 'wb') as f:
                f.write(png_data)
        GENEOF
        python3 generate_icons.py

    - name: Initialize Tauri Android Project
      run: |
        echo "y" | npx tauri android init || true

    - name: Patch Android Manifest and MainActivity for Share & Permissions
      run: |
        python3 -c "
        import os
        manifest_path = 'src-tauri/gen/android/app/src/main/AndroidManifest.xml'
        if os.path.exists(manifest_path):
            with open(manifest_path, 'r') as f:
                content = f.read()
            intent_filter = '''
                <intent-filter>
                    <action android:name="android.intent.action.SEND" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="text/plain" />
                </intent-filter>
            '''
            if 'android.intent.action.SEND' not in content:
                content = content.replace('</activity>', intent_filter + '</activity>')
                with open(manifest_path, 'w') as f:
                    f.write(content)
                print('Successfully patched AndroidManifest.xml')

        import glob
        main_activities = glob.glob('src-tauri/gen/android/**/MainActivity.kt', recursive=True)
        if main_activities:
            main_activity = main_activities[0]
            with open(main_activity, 'r') as f:
                code = f.read()
            permissions_code = '''
            override fun onCreate(savedInstanceState: android.os.Bundle?) {
                super.onCreate(savedInstanceState)
                try {
                    applicationContext.filesDir.walkTopDown().forEach { file ->
                        if (file.isFile) {
                            file.setExecutable(true, false)
                        }
                    }
                } catch (e: Exception) {
                    e.printStackTrace()
                }
            }
            '''
            if 'override fun onCreate' not in code:
                last_brace = code.rfind('}')
                if last_brace != -1:
                    code = code[:last_brace] + '\n' + permissions_code + '\n}'
                    with open(main_activity, 'w') as f:
                        f.write(code)
                    print('Successfully patched MainActivity.kt for executable permissions')
        "

    - name: Build Android App (Tauri Universal)
      run: |
        if [ -f "src-tauri/gen/android/gradlew" ]; then
          chmod +x src-tauri/gen/android/gradlew
        fi
        
        # إعادة إنشاء مجلدات أندرويد لضمان تطابق اسم الباكيج com.seal.rust.app
        rm -rf src-tauri/gen/android
        npx tauri android init
        if [ -f "src-tauri/gen/android/gradlew" ]; then
          chmod +x src-tauri/gen/android/gradlew
        fi
        npx tauri android build


    - name: Sign APK with Auto-Generated Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias seal_key -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=SealPlus, OU=Dev, O=Seal, L=Babil, C=IQ"
        
        APK_PATH="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
        OUTPUT_PATH="src-tauri/gen/android/app/build/outputs/apk/universal/release/SealPlusRust-signed.apk"
        
        if [ -f "$APK_PATH" ]; then
          echo "Signing APK at: $APK_PATH"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | head -n 1)
          $APKSIGNER sign --ks release.keystore --ks-key-alias seal_key --ks-pass pass:password123 --key-pass pass:password123 --out "$OUTPUT_PATH" "$APK_PATH"
          echo "Successfully signed APK!"
        else
          echo "Error: Unsigned APK not found at $APK_PATH"
          exit 1
        fi

    - name: Create Release Draft & Upload Signed APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v0.1.1
        name: "Seal Plus Rust v0.1.1 🚀"
        draft: true
        prerelease: false
        files: |
          src-tauri/gen/android/app/build/outputs/apk/universal/release/SealPlusRust-signed.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
