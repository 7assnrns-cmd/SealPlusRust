name: Build Android APK and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Rust targets for Android
      run: |
        rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

    - name: Install Tauri CLI & Dependencies
      run: npm install

    - name: Generate Valid RGBA Icons Automatically
      run: |
        cat << 'EOF' > generate_icons.py
        import zlib, struct, os
        os.makedirs('src-tauri/icons', exist_ok=True)
        def make_png(w, h, c):
            def chunk(tag, data):
                return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xFFFFFFFF)
            ihdr = struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)
            raw = b"".join(b'\x00' + bytes(c) * w for _ in range(h))
            idat = zlib.compress(raw)
            return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', idat) + chunk(b'IEND', b'')
        
        png_data = make_png(32, 32, (33, 150, 243, 255))
        for name in ['icon.png', '32x32.png', '128x128.png', 'icon.ico', 'icon.icns']:
            with open(os.path.join('src-tauri/icons', name), 'wb') as f:
                f.write(png_data)
        EOF
        python3 generate_icons.py

    - name: Initialize Tauri Android Project
      run: |
        echo "y" | npx tauri android init || true

    - name: Build Android App (Tauri Universal)
      run: |
        if [ -f "src-tauri/gen/android/gradlew" ]; then
          chmod +x src-tauri/gen/android/gradlew
        fi
        npx tauri android build

    - name: Sign APK with Auto-Generated Keystore
      run: |
        sudo apt-get update && sudo apt-get install -y apksigner || true
        keytool -genkey -v -keystore release.keystore -alias seal_key -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=SealPlus, OU=Dev, O=Seal, L=Babil, C=IQ" || true
        
        # البحث عن ملف الـ APK المبني
        APK_PATH=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
        if [ -f "$APK_PATH" ]; then
          echo "Signing APK at: $APK_PATH"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-key-alias seal_key --ks-pass pass:password123 --key-pass pass:password123 --out src-tauri/gen/android/app/build/outputs/apk/release/SealPlusRust-signed.apk "$APK_PATH"
        fi

    - name: Create Release Draft & Upload Signed APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v0.1.0
        name: "Seal Plus Rust v0.1.0 🚀"
        draft: true
        prerelease: false
        files: |
          src-tauri/gen/android/app/build/outputs/apk/release/SealPlusRust-signed.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
