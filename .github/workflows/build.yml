name: Build Android APK and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Rust target for Android
      run: |
        rustup target add aarch64-linux-android

    - name: Install Tauri CLI & Dependencies
      run: npm install

    - name: Generate Valid RGBA Icons Automatically
      run: |
        cat << 'EOF' > generate_icons.py
        import zlib, struct, os
        os.makedirs('src-tauri/icons', exist_ok=True)
        def make_png(w, h, c):
            def chunk(tag, data):
                return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xFFFFFFFF)
            ihdr = struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)
            raw = b"".join(b'\x00' + bytes(c) * w for _ in range(h))
            idat = zlib.compress(raw)
            return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', idat) + chunk(b'IEND', b'')
        
        png_data = make_png(32, 32, (33, 150, 243, 255))
        for name in ['icon.png', '32x32.png', '128x128.png', 'icon.ico', 'icon.icns']:
            with open(os.path.join('src-tauri/icons', name), 'wb') as f:
                f.write(png_data)
        EOF
        python3 generate_icons.py

    - name: Initialize Tauri Android Project
      run: |
        echo "y" | npx tauri android init || true

    - name: Build Android App (Tauri)
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        if [ -f "src-tauri/gen/android/gradlew" ]; then
          chmod +x src-tauri/gen/android/gradlew
        fi
        npx tauri android build --target aarch64

    - name: List all APK files for debugging
      run: |
        echo "🔍 Searching for built APKs in Tauri paths:"
        find src-tauri/gen/android -name "*.apk" -type f -exec ls -lh {} \;

    - name: Create Release Draft & Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v0.1.0
        name: "Seal Plus Rust v0.1.0 🚀"
        draft: true
        prerelease: false
        files: |
          src-tauri/gen/android/app/build/outputs/apk/**/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
