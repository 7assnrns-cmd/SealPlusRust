<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seal Plus Rust</title>
    <style>
      body {
        background: #121212;
        color: #e0e0e0;
        font-family: sans-serif;
        padding: 20px;
        text-align: center;
        margin: 0;
      }
      h1 { color: #d0bcff; }
      .card {
        background: #1e1e1e;
        padding: 20px;
        border-radius: 16px;
        margin-top: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        text-align: right;
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #444;
        background: #2b2b2b;
        color: #fff;
        font-size: 16px;
        outline: none;
        box-sizing: border-box;
      }
      button {
        background: #6750a4;
        color: #fff;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 10px;
        width: 100%;
      }
      button:active { background: #4f378b; }
      pre {
        background: #111;
        padding: 12px;
        border-radius: 8px;
        text-align: left;
        direction: ltr;
        max-height: 200px;
        overflow-y: auto;
        color: #0df;
        font-size: 13px;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <h1>Seal Plus (Rust Core) 🚀</h1>
    <p>تطبيق تحميل الفيديوهات السريع</p>

    <div class="card">
      <label>رابط الفيديو:</label>
      <input type="text" id="urlInput" placeholder="https://..." />
      
      <button id="infoBtn">فحص وجلب المعلومات 🔍</button>
      <button id="downloadBtn" style="background: #2ea44f; margin-top: 8px;">بدء التحميل 📥</button>
      
      <h3 style="margin-top: 20px;">مخرجات العمليات:</h3>
      <pre id="output">جاهز لاستقبال الأوامر...</pre>
    </div>

    <script type="module">
      import { invoke } from '@tauri-apps/api/core';

      const outputEl = document.getElementById('output');

      // جلب معلومات الفيديو
      document.getElementById('infoBtn').addEventListener('click', async () => {
        const url = document.getElementById('urlInput').value.trim();
        if (!url) {
          outputEl.textContent = 'الرجاء إدخال الرابط أولاً!';
          return;
        }
        outputEl.textContent = 'جارٍ جلب معلومات الفيديو عبر Rust...';
        try {
          const res = await invoke('get_video_info', { url });
          outputEl.textContent = res;
        } catch (err) {
          outputEl.textContent = 'خطأ: ' + err;
        }
      });

      // بدء التحميل
      document.getElementById('downloadBtn').addEventListener('click', async () => {
        const url = document.getElementById('urlInput').value.trim();
        if (!url) {
          outputEl.textContent = 'الرجاء إدخال الرابط أولاً!';
          return;
        }
        outputEl.textContent = 'جارٍ بدء التحميل...';
        try {
          const outputPath = '/storage/emulated/0/Download';
          const res = await invoke('start_download', { url, outputPath, isAudioOnly: false });
          outputEl.textContent = 'تم التحميل بنجاح:\n' + res;
        } catch (err) {
          outputEl.textContent = 'خطأ في التحميل: ' + err;
        }
      });
    </script>
  </body>
</html>
