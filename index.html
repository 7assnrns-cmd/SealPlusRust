<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Seal Plus Rust</title>
    <style>
      :root {
        --bg-color: #0f0f13;
        --card-bg: #1a1a24;
        --accent-color: #6750a4;
        --accent-hover: #7f67be;
        --text-main: #f4f4f6;
        --text-sub: #a0a0b2;
        --success-color: #2ea44f;
        --border-color: #2a2a3a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: system-ui, -apple-system, sans-serif;
        padding: 16px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
      header { text-align: center; margin-top: 12px; }
      header h1 {
        font-size: 1.8rem;
        font-weight: 800;
        background: linear-gradient(135deg, #d0bcff 0%, #6750a4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      header p { font-size: 0.85rem; color: var(--text-sub); margin-top: 4px; }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .input-group { display: flex; flex-direction: column; gap: 10px; }
      input[type="text"] {
        width: 100%; padding: 14px 16px; border-radius: 12px;
        border: 1px solid var(--border-color); background: #121218;
        color: #fff; font-size: 15px; outline: none; direction: ltr; text-align: left;
      }
      .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      button {
        padding: 12px 16px; border-radius: 12px; border: none;
        font-size: 14px; font-weight: 700; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 6px;
      }
      .btn-primary { background: var(--accent-color); color: #fff; }
      .btn-secondary { background: #2a2a3a; color: var(--text-main); }
      .format-selector { display: flex; gap: 10px; }
      .radio-label {
        flex: 1; background: #121218; border: 1px solid var(--border-color);
        padding: 10px; border-radius: 10px; text-align: center; font-size: 13px; cursor: pointer;
      }
      .radio-label.active { border-color: var(--accent-color); background: rgba(103, 80, 164, 0.15); color: #d0bcff; font-weight: bold; }
      .status-box {
        margin-top: 8px; background: #111116; border: 1px solid var(--border-color);
        border-radius: 12px; padding: 12px; max-height: 180px; overflow-y: auto;
        font-family: monospace; font-size: 12px; color: #8be9fd; direction: ltr; text-align: left; white-space: pre-wrap;
      }
      .video-preview {
        display: none; align-items: center; gap: 12px; margin-top: 10px;
        background: #121218; padding: 10px; border-radius: 12px; border: 1px solid var(--border-color);
      }
      .video-thumb { width: 80px; height: 50px; object-fit: cover; border-radius: 8px; background: #222; }
      .video-meta h4 { font-size: 13px; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .video-meta p { font-size: 11px; color: var(--text-sub); margin-top: 4px; }
      .section-title { font-size: 1rem; font-weight: 700; color: #d0bcff; margin-bottom: 12px; }
      .setting-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-color); }
      .setting-item:last-child { border-bottom: none; }
      .setting-info h4 { font-size: 14px; color: var(--text-main); }
      .setting-info p { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
      .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #2a2a3a; transition: .3s; border-radius: 24px; }
      .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
      input:checked + .slider { background-color: var(--accent-color); }
      input:checked + .slider:before { transform: translateX(22px); }
      .about-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
      .link-card { background: #121218; border: 1px solid var(--border-color); padding: 10px; border-radius: 12px; text-decoration: none; color: var(--text-main); font-size: 12px; font-weight: 600; text-align: center; }
      .link-card:hover { background: rgba(103, 80, 164, 0.2); }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Seal Plus Rust 🚀</h1>
        <p>محرك تحميل الفيديوهات المطور بـ Rust</p>
      </header>

      <div class="card input-group">
        <input type="text" id="urlInput" placeholder="ألصق رابط الفيديو هنا..." />

        <div class="format-selector">
          <label class="radio-label active" id="lblVideo">
            <input type="radio" name="format" value="video" checked /> 🎬 فيديو
          </label>
          <label class="radio-label" id="lblAudio">
            <input type="radio" name="format" value="audio" /> 🎵 صوت (MP3)
          </label>
        </div>

        <div class="btn-group">
          <button id="infoBtn" class="btn-secondary">فحص 🔍</button>
          <button id="downloadBtn" class="btn-primary">تحميل 📥</button>
        </div>

        <div class="video-preview" id="videoPreview">
          <img id="thumbImg" class="video-thumb" src="" alt="Thumbnail" />
          <div class="video-meta">
            <h4 id="videoTitle">عنوان الفيديو...</h4>
            <p id="videoChannel">القناة / المدة</p>
          </div>
        </div>

        <div class="status-box" id="output">جاهز للاستخدام...</div>
      </div>

      <div class="card">
        <div class="section-title">حول التطبيق والتحديثات</div>
        <div class="setting-item">
          <div class="setting-info">
            <h4>التحديث التلقائي</h4>
            <p>التحقق من التحديثات عبر مستودع GitHub</p>
          </div>
          <label class="switch">
            <input type="checkbox" id="autoUpdateToggle" checked />
            <span class="slider"></span>
          </label>
        </div>
        <div class="about-links">
          <a href="https://github.com/7assnrns-cmd/SealPlusRust" target="_blank" class="link-card">مستودع المشروع</a>
          <a href="https://github.com/7assnrns-cmd/SealPlusRust/releases" target="_blank" class="link-card">الإصدارات</a>
        </div>
      </div>
    </div>

    <script type="module">
      import { invoke } from "@tauri-apps/api/core";

      const urlInput = document.getElementById("urlInput");
      const outputEl = document.getElementById("output");
      const infoBtn = document.getElementById("infoBtn");
      const downloadBtn = document.getElementById("downloadBtn");
      const videoPreview = document.getElementById("videoPreview");
      const thumbImg = document.getElementById("thumbImg");
      const videoTitle = document.getElementById("videoTitle");
      const videoChannel = document.getElementById("videoChannel");
      
      const lblVideo = document.getElementById("lblVideo");
      const lblAudio = document.getElementById("lblAudio");
      let isAudioOnly = false;

      lblVideo.addEventListener("click", () => {
        lblVideo.classList.add("active");
        lblAudio.classList.remove("active");
        isAudioOnly = false;
      });

      lblAudio.addEventListener("click", () => {
        lblAudio.classList.add("active");
        lblVideo.classList.remove("active");
        isAudioOnly = true;
      });

      infoBtn.addEventListener("click", async () => {
        const url = urlInput.value.trim();
        if (!url) { outputEl.textContent = "⚠️ الرجاء إدخال الرابط أولاً!"; return; }
        outputEl.textContent = "🔄 جارٍ فحص الرابط وتحليل البيانات...";
        videoPreview.style.display = "none";

        try {
          const res = await invoke("get_video_info", { url });
          const data = JSON.parse(res);
          
          if (data.title) {
            videoTitle.textContent = data.title;
            videoChannel.textContent = (data.uploader || "غير معروف") + " • " + Math.round(data.duration / 60) + " دقيقة";
            if (data.thumbnail) {
              thumbImg.src = data.thumbnail;
            }
            videoPreview.style.display = "flex";
          }
          outputEl.textContent = "✅ تم جلب وتحليل بيانات الفيديو بنجاح!";
        } catch (err) {
          outputEl.textContent = "❌ خطأ في التحليل: " + err;
        }
      });

      downloadBtn.addEventListener("click", async () => {
        const url = urlInput.value.trim();
        if (!url) { outputEl.textContent = "⚠️ الرجاء إدخال الرابط أولاً!"; return; }
        outputEl.textContent = "⏳ جارٍ بدء التحميل في الخلفية...";
        try {
          const outputPath = "/storage/emulated/0/Download";
          const res = await invoke("start_download", { url, outputPath, isAudioOnly });
          outputEl.textContent = "🎉 تم التحميل بنجاح:
" + res;
        } catch (err) {
          outputEl.textContent = "❌ خطأ في التحميل: " + err;
        }
      });
    </script>
  </body>
</html>
