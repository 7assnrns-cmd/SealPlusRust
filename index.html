<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Seal Plus Rust</title>
    <style>
      :root {
        --bg-color: #0f0f13;
        --card-bg: #1a1a24;
        --accent-color: #6750a4;
        --accent-hover: #7f67be;
        --text-main: #f4f4f6;
        --text-sub: #a0a0b2;
        --success-color: #2ea44f;
        --error-color: #cf6679;
        --border-color: #2a2a3a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 16px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .container {
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      header {
        text-align: center;
        margin-top: 12px;
        margin-bottom: 8px;
      }

      header h1 {
        font-size: 1.8rem;
        font-weight: 800;
        background: linear-gradient(135deg, #d0bcff 0%, #6750a4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      header p {
        font-size: 0.85rem;
        color: var(--text-sub);
        margin-top: 4px;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      input[type="text"] {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background: #121218;
        color: #fff;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s;
        direction: ltr;
        text-align: left;
      }

      input[type="text"]:focus {
        border-color: var(--accent-color);
      }

      .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      button {
        padding: 12px 16px;
        border-radius: 12px;
        border: none;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.1s, background-color 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      button:active {
        transform: scale(0.97);
      }

      .btn-primary {
        background: var(--accent-color);
        color: #fff;
      }

      .btn-primary:hover {
        background: var(--accent-hover);
      }

      .btn-success {
        background: var(--success-color);
        color: #fff;
      }

      .btn-secondary {
        background: #2a2a3a;
        color: var(--text-main);
      }

      .format-selector {
        display: flex;
        gap: 10px;
        margin-top: 4px;
      }

      .radio-label {
        flex: 1;
        background: #121218;
        border: 1px solid var(--border-color);
        padding: 10px;
        border-radius: 10px;
        text-align: center;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .radio-label input {
        display: none;
      }

      .radio-label.active {
        border-color: var(--accent-color);
        background: rgba(103, 80, 164, 0.15);
        color: #d0bcff;
        font-weight: bold;
      }

      .status-box {
        margin-top: 8px;
        background: #111116;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 12px;
        max-height: 180px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 12px;
        color: #8be9fd;
        direction: ltr;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .spinner {
        display: none;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Seal Plus Rust 🚀</h1>
        <p>محرك التحميل السريع بآداء عالي وتصميم حديث</p>
      </header>

      <div class="card input-group">
        <input type="text" id="urlInput" placeholder="ألصق رابط الفيديو هنا..." />

        <div class="format-selector">
          <label class="radio-label active" id="lblVideo">
            <input type="radio" name="format" value="video" checked /> 🎬 فيديو (Best)
          </label>
          <label class="radio-label" id="lblAudio">
            <input type="radio" name="format" value="audio" /> 🎵 صوت فقط (MP3)
          </label>
        </div>

        <div class="btn-group">
          <button id="infoBtn" class="btn-secondary">
            <span class="spinner" id="infoSpinner"></span>
            <span>فحص الرابط 🔍</span>
          </button>
          <button id="downloadBtn" class="btn-primary">
            <span class="spinner" id="dlSpinner"></span>
            <span>بدء التحميل 📥</span>
          </button>
        </div>
      </div>

      <div class="card">
        <h4 style="font-size: 13px; color: var(--text-sub); margin-bottom: 8px;">سجل المعالجة والحالة:</h4>
        <div class="status-box" id="output">جاهز لاستقبال الأوامر...</div>
      </div>
    </div>

    <script type="module">
      import { invoke } from '@tauri-apps/api/core';

      const urlInput = document.getElementById('urlInput');
      const outputEl = document.getElementById('output');
      const infoBtn = document.getElementById('infoBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const infoSpinner = document.getElementById('infoSpinner');
      const dlSpinner = document.getElementById('dlSpinner');
      
      const lblVideo = document.getElementById('lblVideo');
      const lblAudio = document.getElementById('lblAudio');
      let isAudioOnly = false;

      // التبديل بين خيارات الصوت والفيديو
      lblVideo.addEventListener('click', () => {
        lblVideo.classList.add('active');
        lblAudio.classList.remove('active');
        isAudioOnly = false;
      });

      lblAudio.addEventListener('click', () => {
        lblAudio.classList.add('active');
        lblVideo.classList.remove('active');
        isAudioOnly = true;
      });

      function setLoading(btn, spinner, isLoading) {
        btn.disabled = isLoading;
        spinner.style.display = isLoading ? 'inline-block' : 'none';
      }

      // فحص جودة ومعلومات الفيديو
      infoBtn.addEventListener('click', async () => {
        const url = urlInput.value.trim();
        if (!url) {
          outputEl.textContent = '⚠️ الرجاء إدخال رابط الفيديو أولاً!';
          return;
        }
        setLoading(infoBtn, infoSpinner, true);
        outputEl.textContent = '🔄 جارٍ جلب البيانات عبر نواة Rust...';

        try {
          const res = await invoke('get_video_info', { url });
          outputEl.textContent = '✅ معلومات الفيديو:\n' + res;
        } catch (err) {
          outputEl.textContent = '❌ خطأ: ' + err;
        } finally {
          setLoading(infoBtn, infoSpinner, false);
        }
      });

      // بدء عمل المحرك والتحميل
      downloadBtn.addEventListener('click', async () => {
        const url = urlInput.value.trim();
        if (!url) {
          outputEl.textContent = '⚠️ الرجاء إدخال رابط الفيديو أولاً!';
          return;
        }
        setLoading(downloadBtn, dlSpinner, true);
        outputEl.textContent = '⏳ جارٍ بدء التحميل والمعالجة...';

        try {
          const outputPath = '/storage/emulated/0/Download';
          const res = await invoke('start_download', { url, outputPath, isAudioOnly });
          outputEl.textContent = '🎉 تم التحميل بنجاح!\n' + res;
        } catch (err) {
          outputEl.textContent = '❌ خطأ في التحميل: ' + err;
        } finally {
          setLoading(downloadBtn, dlSpinner, false);
        }
      });
    </script>
  </body>
</html>
